<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link rel="stylesheet" href="style.css">
	<title>Login</title>
</head>

<body class="login">
	<div class="container-fluid">
		<!-- <img src="https://cdn.britannica.com/17/83817-050-67C814CD/Mount-Everest.jpg" alt=""> -->
		<div class="row mt-5 pt-5">
			<div class="col-4 offset-4">
				<div class="card bg-dark card-login">
					<div class="card-body p-5">
						<div class="row">
							<div class="col-12 text-center text-white">
								<strong class="font-lg">Your Account</strong>
							</div>
							<div class="col-12">
								<small class="text-white">Username</small>
								<input type="text" name="username" class="form-control bg-dark border-login">
							</div>
							<div class="col-12">
								<small class="text-white">Password</small>
								<input type="text" name="username" class="form-control bg-dark border-login">
							</div>
							<div class="col-12 mt-4 text-center">
								<button class="btn btn-block bg-light-color text-dark rounded-pill">
									<strong>LOGIN</strong>
								</button>
							</div>
							<div class="col-12 text-center mt-3">
								<button class="btn btn-block btn-sm bg-dark text-white rounded-pill">
									REGISTER
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
